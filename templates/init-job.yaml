{{- if and .Values.initJob.enabled .Values.httpbun.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: "{{ .Values.initJob.image.repository }}:{{ .Values.initJob.image.tag }}"
          imagePullPolicy: {{ .Values.initJob.image.pullPolicy }}
          securityContext:
            runAsUser: 0 # ponytail: root for apk add jq, drop when jq baked into image
          env:
            - name: MAPI
              value: "http://{{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.gravitee.api.service.externalPort }}/management"
            - name: PAPI
              value: "http://{{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.gravitee.api.service.externalPort }}/portal"
            - name: ADMIN_USER
              value: admin
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-api-admin
                  key: password
                  optional: true
            # fallback if secret not present (default gravitee admin/admin)
            - name: ADMIN_PASS_FALLBACK
              value: admin
          command: ["/bin/sh", "-c"]
          args:
            - |
              # ponytail: install jq if missing (curlimages/curl has no jq), remove when image includes jq
              if ! command -v jq >/dev/null 2>&1; then apk add --no-cache jq >/dev/null 2>&1 || apt-get update -qq && apt-get install -y -qq jq >/dev/null 2>&1 || true; fi
              set -eu
              # ponytail: naive retry + idempotent; upgrade path: operator if init grows
              PASS="${ADMIN_PASS:-$ADMIN_PASS_FALLBACK}"
              ENVS="organizations/DEFAULT/environments/DEFAULT"
              MAPI_URL="${MAPI}"
              PAPI_URL="${PAPI}"

              echo "waiting for management API..."
              for i in $(seq 1 60); do
                if curl -sf -u "$ADMIN_USER:$PASS" "${MAPI_URL}/v2/${ENVS}/apis" >/dev/null 2>&1; then echo "mapi ready"; break; fi
                # try fallback admin/admin if secret auth failed
                if curl -sf -u admin:admin "${MAPI_URL}/v2/${ENVS}/apis" >/dev/null 2>&1; then ADMIN_USER=admin; PASS=admin; echo "mapi ready (fallback)"; break; fi
                echo "retry $i"; sleep 5
              done
              curl -sf -u "$ADMIN_USER:$PASS" "${MAPI_URL}/v2/${ENVS}/apis" >/dev/null || { echo "mapi not ready"; exit 1; }

              APIS=$(curl -sf -u "$ADMIN_USER:$PASS" "${MAPI_URL}/v2/${ENVS}/apis")
              API_ID=$(echo "$APIS" | jq -r '.data[] | select(.name=="httpbun PoC API") | .id' | head -1)
              if [ -z "$API_ID" ] || [ "$API_ID" = "null" ]; then
                echo "creating API httpbun PoC API"
                API_ID=$(curl -sf -u "$ADMIN_USER:$PASS" -X POST -H 'Content-Type: application/json' "${MAPI_URL}/v2/${ENVS}/apis" -d '{
                  "name": "httpbun PoC API",
                  "apiVersion": "1.0.0",
                  "definitionVersion": "V4",
                  "type": "PROXY",
                  "listeners": [{"type": "HTTP","paths": [{"path": "/httpbun"}],"entrypoints": [{"type": "http-proxy"}]}],
                  "endpointGroups": [{"name": "default-group","type": "http-proxy","endpoints": [
                    {"name": "default","type": "http-proxy","weight": 1,"inheritConfiguration": false,"configuration": {"target": "http://{{ .Release.Name }}-httpbun.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.httpbun.service.port }}"}}
                  ]}]
                }' | jq -r '.id')
                echo "created $API_ID"
                STATE=""
              else
                echo "api exists $API_ID"
                STATE=$(echo "$APIS" | jq -r --arg id "$API_ID" '.data[] | select(.id==$id) | .state')
              fi

              PLANS=$(curl -sf -u "$ADMIN_USER:$PASS" "${MAPI_URL}/v2/${ENVS}/apis/${API_ID}/plans")
              PLAN_ID=$(echo "$PLANS" | jq -r '.data[] | select(.name=="API Key") | .id' | head -1)
              if [ -z "$PLAN_ID" ] || [ "$PLAN_ID" = "null" ]; then
                PLAN_ID=$(curl -sf -u "$ADMIN_USER:$PASS" -X POST -H 'Content-Type: application/json' "${MAPI_URL}/v2/${ENVS}/apis/${API_ID}/plans" -d '{
                  "definitionVersion": "V4","name": "API Key","security": {"type": "API_KEY"},"mode": "STANDARD","validation": "AUTO"
                }' | jq -r '.id')
                echo "created plan $PLAN_ID"
                curl -sf -u "$ADMIN_USER:$PASS" -X POST "${MAPI_URL}/v2/${ENVS}/apis/${API_ID}/plans/${PLAN_ID}/_publish" >/dev/null
                echo "published plan"
              else
                echo "plan exists $PLAN_ID"
                # ensure published
                STATUS=$(echo "$PLANS" | jq -r --arg id "$PLAN_ID" '.data[] | select(.id==$id) | .status')
                if [ "$STATUS" != "PUBLISHED" ]; then
                  curl -sf -u "$ADMIN_USER:$PASS" -X POST "${MAPI_URL}/v2/${ENVS}/apis/${API_ID}/plans/${PLAN_ID}/_publish" >/dev/null || true
                fi
              fi

              if [ "${STATE:-}" != "STARTED" ]; then
                curl -sf -u "$ADMIN_USER:$PASS" -X POST "${MAPI_URL}/v2/${ENVS}/apis/${API_ID}/_start" >/dev/null || true
                echo "started api"
              fi

              # ponytail: sleep 6 for gateway sync (5s interval), remove if polling gateway sync endpoint
              sleep 6

              # create N applications + subscriptions (3 keys covering all upstreams) via portal
              for i in $(seq 1 {{ .Values.initJob.apiKeys }}); do
                APP_NAME="app-$i"
                EXIST=$(curl -sf -u "$ADMIN_USER:$PASS" "${PAPI_URL}/environments/DEFAULT/applications" | jq -r --arg n "$APP_NAME" '.data[] | select(.name==$n) | .id' | head -1)
                if [ -z "$EXIST" ] || [ "$EXIST" = "null" ]; then
                  APP_RESP=$(curl -sf -u "$ADMIN_USER:$PASS" -X POST -H 'Content-Type: application/json' "${PAPI_URL}/environments/DEFAULT/applications" -d "{\"name\":\"$APP_NAME\",\"description\":\"auto $APP_NAME\",\"settings\":{\"app\":{}}}")
                  APP_ID=$(echo "$APP_RESP" | jq -r '.id')
                  echo "created app $APP_NAME $APP_ID"
                else
                  APP_ID="$EXIST"
                  echo "app exists $APP_NAME $APP_ID"
                fi
                # subscription via portal (filter by both app and plan, query param ignored by server so filter in jq)
                SUBS=$(curl -sf -u "$ADMIN_USER:$PASS" "${PAPI_URL}/environments/DEFAULT/subscriptions?application=${APP_ID}" | jq -r --arg pid "$PLAN_ID" --arg aid "$APP_ID" '.data[] | select(.plan==$pid and .application==$aid) | .id' | head -1)
                if [ -z "$SUBS" ] || [ "$SUBS" = "null" ]; then
                  curl -sf -u "$ADMIN_USER:$PASS" -X POST -H 'Content-Type: application/json' "${PAPI_URL}/environments/DEFAULT/subscriptions" -d "{\"application\":\"$APP_ID\",\"plan\":\"$PLAN_ID\"}" >/dev/null
                  echo "subscribed $APP_NAME to $PLAN_ID"
                else
                  echo "subscription exists $APP_NAME"
                fi
              done

              echo "init done — verify: curl -H \"X-Gravitee-Api-Key: <key>\" http://gateway/httpbun/get (401 without key, never hits httpbun)"
{{- end }}
