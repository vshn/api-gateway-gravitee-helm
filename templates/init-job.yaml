{{- if and .Values.initJob.enabled .Values.httpbun.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: "{{ .Values.initJob.image.repository }}:{{ .Values.initJob.image.tag }}"
          imagePullPolicy: {{ .Values.initJob.image.pullPolicy }}
          env:
            - name: MAPI
              value: "http://{{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.gravitee.api.service.externalPort }}/management"
            - name: PAPI
              value: "http://{{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.gravitee.api.service.externalPort }}/portal"
            - name: ADMIN_USER
              value: admin
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-env
                  key: ADMIN_PASSWORD
            {{- if .Values.litellm_api_enabled }}
            - name: LITELLM_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-env
                  key: LITELLM_URL
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-env
                  key: LITELLM_API_KEY
            {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              # ponytail: naive retry + idempotent; upgrade path: operator if init grows
              PASS="${ADMIN_PASS}"
              ENVS="organizations/DEFAULT/environments/DEFAULT"
              MAPI_URL="${MAPI}"
              PAPI_URL="${PAPI}"

              echo "waiting for management API..."
              for i in $(seq 1 60); do
                if curl -sf -u "$ADMIN_USER:$PASS" "${MAPI_URL}/v2/${ENVS}/apis" >/dev/null 2>&1; then echo "mapi ready"; break; fi
                echo "retry $i"; sleep 5
              done
              curl -sf -u "$ADMIN_USER:$PASS" "${MAPI_URL}/v2/${ENVS}/apis" >/dev/null || { echo "mapi not ready"; exit 1; }

              APIS=$(curl -sf -u "$ADMIN_USER:$PASS" "${MAPI_URL}/v2/${ENVS}/apis")
              API_ID=$(echo "$APIS" | jq -r '.data[] | select(.name=="httpbun PoC API") | .id' | head -1)
              if [ -z "$API_ID" ] || [ "$API_ID" = "null" ]; then
                echo "creating API httpbun PoC API"
                API_ID=$(curl -sf -u "$ADMIN_USER:$PASS" -X POST -H 'Content-Type: application/json' "${MAPI_URL}/v2/${ENVS}/apis" -d '{
                  "name": "httpbun PoC API",
                  "apiVersion": "1.0.0",
                  "definitionVersion": "V4",
                  "type": "PROXY",
                  "listeners": [{"type": "HTTP","paths": [{"path": "/httpbun"}],"entrypoints": [{"type": "http-proxy"}]}],
                  "endpointGroups": [{"name": "default-group","type": "http-proxy","endpoints": [
                    {"name": "default","type": "http-proxy","weight": 1,"inheritConfiguration": false,"configuration": {"target": "http://{{ .Release.Name }}-httpbun.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.httpbun.service.port }}"}}
                  ]}]
                }' | jq -r '.id')
                echo "created $API_ID"
                STATE=""
              else
                echo "api exists $API_ID"
                STATE=$(echo "$APIS" | jq -r --arg id "$API_ID" '.data[] | select(.id==$id) | .state')
              fi

              PLANS=$(curl -sf -u "$ADMIN_USER:$PASS" "${MAPI_URL}/v2/${ENVS}/apis/${API_ID}/plans")
              PLAN_ID=$(echo "$PLANS" | jq -r '.data[] | select(.name=="API Key") | .id' | head -1)
              if [ -z "$PLAN_ID" ] || [ "$PLAN_ID" = "null" ]; then
                PLAN_ID=$(curl -sf -u "$ADMIN_USER:$PASS" -X POST -H 'Content-Type: application/json' "${MAPI_URL}/v2/${ENVS}/apis/${API_ID}/plans" -d '{
                  "definitionVersion": "V4","name": "API Key","security": {"type": "API_KEY","configuration": {"source": "BEARER"}},"mode": "STANDARD","validation": "AUTO"
                }' | jq -r '.id')
                echo "created plan $PLAN_ID"
                curl -sf -u "$ADMIN_USER:$PASS" -X POST "${MAPI_URL}/v2/${ENVS}/apis/${API_ID}/plans/${PLAN_ID}/_publish" >/dev/null
                echo "published plan"
              else
                echo "plan exists $PLAN_ID"
                # ensure published
                STATUS=$(echo "$PLANS" | jq -r --arg id "$PLAN_ID" '.data[] | select(.id==$id) | .status')
                if [ "$STATUS" != "PUBLISHED" ]; then
                  curl -sf -u "$ADMIN_USER:$PASS" -X POST "${MAPI_URL}/v2/${ENVS}/apis/${API_ID}/plans/${PLAN_ID}/_publish" >/dev/null || true
                fi
                # migrate pre-Bearer plan: PUT full body back with security flipped
                SEC=$(echo "$PLANS" | jq -c --arg id "$PLAN_ID" '.data[] | select(.id==$id) | .security')
                if ! echo "$SEC" | grep -q BEARER; then
                  echo "$PLANS" | jq --arg id "$PLAN_ID" '[.data[] | select(.id==$id)] | .[0] | .security = {"type":"API_KEY","configuration":{"source":"BEARER"}}' > /tmp/plan-body.json
                  curl -sf -u "$ADMIN_USER:$PASS" -X PUT -H 'Content-Type: application/json' "${MAPI_URL}/v2/${ENVS}/apis/${API_ID}/plans/${PLAN_ID}" -d @/tmp/plan-body.json >/dev/null
                  # gateway does not redeploy on plan-only changes, and a same-second
                  # _stop/_start is invisible to its 5s sync: hold stopped for one
                  # tick (sleep 7) so undeploy+redeploy picks up the BEARER plan
                  curl -sf -u "$ADMIN_USER:$PASS" -X POST "${MAPI_URL}/v2/${ENVS}/apis/${API_ID}/_stop" >/dev/null || true
                  sleep 7
                  curl -sf -u "$ADMIN_USER:$PASS" -X POST "${MAPI_URL}/v2/${ENVS}/apis/${API_ID}/_start" >/dev/null || true
                  echo "plan migrated to BEARER source (api redeployed)"
                fi
              fi

              if [ "${STATE:-}" != "STARTED" ]; then
                curl -sf -u "$ADMIN_USER:$PASS" -X POST "${MAPI_URL}/v2/${ENVS}/apis/${API_ID}/_start" >/dev/null || true
                echo "started api"
              fi

              # catalog-visible: PUBLISHED + PUBLIC (v2 PUT needs the full body back)
              API_BODY=$(curl -sf -u "$ADMIN_USER:$PASS" "${MAPI_URL}/v2/${ENVS}/apis/${API_ID}")
              CUR=$(echo "$API_BODY" | jq -r '[.lifecycleState,.visibility] | join("/")')
              if [ "$CUR" != "PUBLISHED/PUBLIC" ]; then
                echo "$API_BODY" | jq 'if .lifecycleState == "CREATED" then .lifecycleState = "PUBLISHED" else . end | .visibility = "PUBLIC"' > /tmp/api-body.json
                curl -sf -u "$ADMIN_USER:$PASS" -X PUT -H 'Content-Type: application/json' "${MAPI_URL}/v2/${ENVS}/apis/${API_ID}" -d @/tmp/api-body.json >/dev/null
                echo "api published to catalog"
              fi

              {{- if .Values.litellm_api_enabled }}
              # LITELLM_API: /litellm -> $LITELLM_URL; same Bearer plan; upstream
              # Authorization replaced with "Bearer $LITELLM_API_KEY" by a
              # REQUEST-phase transform-headers flow (plan security consumed the
              # client key first; the upstream key is never returned to clients)
              LAPI_NAME="LITELLM_API"
              API_ID_LL=$(echo "$APIS" | jq -r --arg n "$LAPI_NAME" '.data[] | select(.name==$n) | .id' | head -1)
              if [ -z "$API_ID_LL" ] || [ "$API_ID_LL" = "null" ]; then
                echo "creating API $LAPI_NAME"
                jq -n --arg target "$LITELLM_URL" --arg key "$LITELLM_API_KEY" '{
                  name: "LITELLM_API",
                  apiVersion: "1.0.0",
                  definitionVersion: "V4",
                  type: "PROXY",
                  listeners: [{type: "HTTP", paths: [{path: "/litellm"}], entrypoints: [{type: "http-proxy"}]}],
                  endpointGroups: [{name: "default-group", type: "http-proxy", endpoints: [
                    {name: "default", type: "http-proxy", weight: 1, inheritConfiguration: false, configuration: {target: $target}}
                  ]}],
                  flows: [{
                    name: "replace-authorization",
                    enabled: true,
                    request: [{
                      name: "Transform Headers",
                      description: "",
                      enabled: true,
                      policy: "transform-headers",
                      configuration: {addHeaders: [{name: "Authorization", value: ("Bearer " + $key)}], scope: "REQUEST"}
                    }]
                  }]
                }' > /tmp/litellm-api.json
                API_ID_LL=$(curl -sf -u "$ADMIN_USER:$PASS" -X POST -H 'Content-Type: application/json' "${MAPI_URL}/v2/${ENVS}/apis" -d @/tmp/litellm-api.json | jq -r '.id')
                echo "created $API_ID_LL"
                STATE_LL=""
              else
                echo "api exists $API_ID_LL"
                STATE_LL=$(echo "$APIS" | jq -r --arg id "$API_ID_LL" '.data[] | select(.id==$id) | .state')
                # self-heal manually-created APIs: the transform-headers flow must
                # inject the real upstream key (a console-created placeholder like
                # "Bearer <token>" would otherwise survive the reuse above)
                WANT_VAL="Bearer $LITELLM_API_KEY"
                HAS_FLOW=$(curl -sf -u "$ADMIN_USER:$PASS" "${MAPI_URL}/v2/${ENVS}/apis/${API_ID_LL}" | jq --arg want "$WANT_VAL" '([.flows[]?.request[]? | select(.policy=="transform-headers") | .configuration.addHeaders[]? | select(.name=="Authorization" and .value==$want)] | length) > 0')
                if [ "$HAS_FLOW" != "true" ]; then
                  curl -sf -u "$ADMIN_USER:$PASS" "${MAPI_URL}/v2/${ENVS}/apis/${API_ID_LL}" | jq --arg key "$LITELLM_API_KEY" '.flows = [{
                    name: "replace-authorization",
                    enabled: true,
                    request: [{
                      name: "Transform Headers",
                      description: "",
                      enabled: true,
                      policy: "transform-headers",
                      configuration: {addHeaders: [{name: "Authorization", value: ("Bearer " + $key)}], scope: "REQUEST"}
                    }]
                  }]' > /tmp/litellm-api-body.json
                  curl -sf -u "$ADMIN_USER:$PASS" -X PUT -H 'Content-Type: application/json' "${MAPI_URL}/v2/${ENVS}/apis/${API_ID_LL}" -d @/tmp/litellm-api-body.json >/dev/null
                  # definition-only PUT emits no event: same sync blind spot as the
                  # plan migration — hold stopped for one tick so the redeploy
                  # picks up the healed flow
                  curl -sf -u "$ADMIN_USER:$PASS" -X POST "${MAPI_URL}/v2/${ENVS}/apis/${API_ID_LL}/_stop" >/dev/null || true
                  sleep 7
                  curl -sf -u "$ADMIN_USER:$PASS" -X POST "${MAPI_URL}/v2/${ENVS}/apis/${API_ID_LL}/_start" >/dev/null || true
                  echo "litellm flow fixed (placeholder/missing transform-headers replaced)"
                fi
              fi

              PLANS_LL=$(curl -sf -u "$ADMIN_USER:$PASS" "${MAPI_URL}/v2/${ENVS}/apis/${API_ID_LL}/plans")
              LITELLM_PLAN_ID=$(echo "$PLANS_LL" | jq -r '.data[] | select(.name=="API Key") | .id' | head -1)
              if [ -z "$LITELLM_PLAN_ID" ] || [ "$LITELLM_PLAN_ID" = "null" ]; then
                LITELLM_PLAN_ID=$(curl -sf -u "$ADMIN_USER:$PASS" -X POST -H 'Content-Type: application/json' "${MAPI_URL}/v2/${ENVS}/apis/${API_ID_LL}/plans" -d '{
                  "definitionVersion": "V4","name": "API Key","security": {"type": "API_KEY","configuration": {"source": "BEARER"}},"mode": "STANDARD","validation": "AUTO"
                }' | jq -r '.id')
                echo "created litellm plan $LITELLM_PLAN_ID"
                curl -sf -u "$ADMIN_USER:$PASS" -X POST "${MAPI_URL}/v2/${ENVS}/apis/${API_ID_LL}/plans/${LITELLM_PLAN_ID}/_publish" >/dev/null
                echo "published litellm plan"
              else
                echo "litellm plan exists $LITELLM_PLAN_ID"
                STATUS_LL=$(echo "$PLANS_LL" | jq -r --arg id "$LITELLM_PLAN_ID" '.data[] | select(.id==$id) | .status')
                if [ "$STATUS_LL" != "PUBLISHED" ]; then
                  curl -sf -u "$ADMIN_USER:$PASS" -X POST "${MAPI_URL}/v2/${ENVS}/apis/${API_ID_LL}/plans/${LITELLM_PLAN_ID}/_publish" >/dev/null || true
                fi
                SEC_LL=$(echo "$PLANS_LL" | jq -c --arg id "$LITELLM_PLAN_ID" '.data[] | select(.id==$id) | .security')
                if ! echo "$SEC_LL" | grep -q BEARER; then
                  echo "$PLANS_LL" | jq --arg id "$LITELLM_PLAN_ID" '[.data[] | select(.id==$id)] | .[0] | .security = {"type":"API_KEY","configuration":{"source":"BEARER"}}' > /tmp/plan-body.json
                  curl -sf -u "$ADMIN_USER:$PASS" -X PUT -H 'Content-Type: application/json' "${MAPI_URL}/v2/${ENVS}/apis/${API_ID_LL}/plans/${LITELLM_PLAN_ID}" -d @/tmp/plan-body.json >/dev/null
                  # gateway does not redeploy on plan-only changes, and a same-second
                  # _stop/_start is invisible to its 5s sync: hold stopped for one
                  # tick (sleep 7) so undeploy+redeploy picks up the BEARER plan
                  curl -sf -u "$ADMIN_USER:$PASS" -X POST "${MAPI_URL}/v2/${ENVS}/apis/${API_ID_LL}/_stop" >/dev/null || true
                  sleep 7
                  curl -sf -u "$ADMIN_USER:$PASS" -X POST "${MAPI_URL}/v2/${ENVS}/apis/${API_ID_LL}/_start" >/dev/null || true
                  echo "litellm plan migrated to BEARER source (api redeployed)"
                fi
              fi

              if [ "${STATE_LL:-}" != "STARTED" ]; then
                curl -sf -u "$ADMIN_USER:$PASS" -X POST "${MAPI_URL}/v2/${ENVS}/apis/${API_ID_LL}/_start" >/dev/null || true
                echo "started litellm api"
              fi

              # catalog-visible: PUBLISHED + PUBLIC (v2 PUT needs the full body back)
              API_BODY_LL=$(curl -sf -u "$ADMIN_USER:$PASS" "${MAPI_URL}/v2/${ENVS}/apis/${API_ID_LL}")
              CUR_LL=$(echo "$API_BODY_LL" | jq -r '[.lifecycleState,.visibility] | join("/")')
              if [ "$CUR_LL" != "PUBLISHED/PUBLIC" ]; then
                echo "$API_BODY_LL" | jq 'if .lifecycleState == "CREATED" then .lifecycleState = "PUBLISHED" else . end | .visibility = "PUBLIC"' > /tmp/api-body.json
                curl -sf -u "$ADMIN_USER:$PASS" -X PUT -H 'Content-Type: application/json' "${MAPI_URL}/v2/${ENVS}/apis/${API_ID_LL}" -d @/tmp/api-body.json >/dev/null
                echo "litellm api published to catalog"
              fi
              {{- end }}

              # ponytail: sleep 6 for gateway sync (5s interval), remove if polling gateway sync endpoint
              sleep 6

              # subscribe app-1..N to every managed plan (httpbun + litellm)
              ALL_PLANS="$PLAN_ID"
              {{- if .Values.litellm_api_enabled }}
              ALL_PLANS="$ALL_PLANS $LITELLM_PLAN_ID"
              {{- end }}

              # create N applications + subscriptions (3 keys covering all upstreams) via portal
              for i in $(seq 1 {{ .Values.initJob.apiKeys }}); do
                APP_NAME="app-$i"
                EXIST=$(curl -sf -u "$ADMIN_USER:$PASS" "${PAPI_URL}/environments/DEFAULT/applications" | jq -r --arg n "$APP_NAME" '.data[] | select(.name==$n) | .id' | head -1)
                if [ -z "$EXIST" ] || [ "$EXIST" = "null" ]; then
                  APP_RESP=$(curl -sf -u "$ADMIN_USER:$PASS" -X POST -H 'Content-Type: application/json' "${PAPI_URL}/environments/DEFAULT/applications" -d "{\"name\":\"$APP_NAME\",\"description\":\"auto $APP_NAME\",\"settings\":{\"app\":{}}}")
                  APP_ID=$(echo "$APP_RESP" | jq -r '.id')
                  echo "created app $APP_NAME $APP_ID"
                else
                  APP_ID="$EXIST"
                  echo "app exists $APP_NAME $APP_ID"
                fi
                # subscription via portal (filter by both app and plan, query param ignored by server so filter in jq)
                for P in $ALL_PLANS; do
                  SUBS=$(curl -sf -u "$ADMIN_USER:$PASS" "${PAPI_URL}/environments/DEFAULT/subscriptions?application=${APP_ID}" | jq -r --arg pid "$P" --arg aid "$APP_ID" '.data[] | select(.plan==$pid and .application==$aid) | .id' | head -1)
                  if [ -z "$SUBS" ] || [ "$SUBS" = "null" ]; then
                    curl -sf -u "$ADMIN_USER:$PASS" -X POST -H 'Content-Type: application/json' "${PAPI_URL}/environments/DEFAULT/subscriptions" -d "{\"application\":\"$APP_ID\",\"plan\":\"$P\"}" >/dev/null
                    echo "subscribed $APP_NAME to $P"
                  else
                    echo "subscription exists $APP_NAME/$P"
                  fi
                done
              done

              echo "init done — verify: curl -H \"Authorization: Bearer <key>\" http://gateway/httpbun/get (401 without key or with X-Gravitee-Api-Key; never hits upstream)"
{{- end }}
