{{- if .Values.gravitee.api.enabled }}
{{- $jwt := required ".Values.env.JWT_SECRET is required (gravitee.jwtSecret, see values.secret.example.yaml)" (index .Values.env "JWT_SECRET") }}
{{- if .Values.postgresql.enabled }}
{{- $pg := required ".Values.env.POSTGRES_PASSWORD is required (bundled postgres, see values.secret.example.yaml)" (index .Values.env "POSTGRES_PASSWORD") }}
{{- end }}
{{- if and .Values.initJob.enabled .Values.httpbun.enabled }}
{{- $admin := required ".Values.env.ADMIN_PASSWORD is required (init job, see values.secret.example.yaml)" (index .Values.env "ADMIN_PASSWORD") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-env
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-env
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
