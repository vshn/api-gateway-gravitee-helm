{{- if .Values.gravitee.api.enabled }}
{{- $jwt := required ".Values.env.JWT_SECRET is required (gravitee.jwtSecret, see values.secret.example.yaml)" (index .Values.env "JWT_SECRET") }}
{{- if .Values.postgresql.enabled }}
{{- $pg := required ".Values.env.POSTGRES_PASSWORD is required (bundled postgres, see values.secret.example.yaml)" (index .Values.env "POSTGRES_PASSWORD") }}
{{- end }}
{{- if and .Values.initJob.enabled .Values.httpbun.enabled }}
{{- $admin := required ".Values.env.ADMIN_PASSWORD is required (init job, see values.secret.example.yaml)" (index .Values.env "ADMIN_PASSWORD") }}
{{- end }}
{{- if .Values.litellm_api_enabled }}
{{- if not (and .Values.initJob.enabled .Values.httpbun.enabled) }}
{{- fail "litellm_api_enabled requires initJob.enabled=true and httpbun.enabled=true (the init job creates the API)" }}
{{- end }}
{{- $llurl := required ".Values.env.LITELLM_URL is required (litellm_api_enabled, see values.secret.example.yaml)" (index .Values.env "LITELLM_URL") }}
{{- $llkey := required ".Values.env.LITELLM_API_KEY is required (litellm_api_enabled, see values.secret.example.yaml)" (index .Values.env "LITELLM_API_KEY") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-env
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-env
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
