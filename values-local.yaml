gravitee:
  mongodb:
    enabled: false
  mongo:
    dbhost: gravitee-mongodb
    rsEnabled: false
  elasticsearch:
    enabled: false
  es:
    enabled: false
  api:
    analytics:
      type: none
    ingress:
      management:
        enabled: false
      portal:
        enabled: false
  gateway:
    reporters:
      elasticsearch:
        enabled: false
    ingress:
      enabled: false
  ui:
    ingress:
      enabled: false
  portal:
    ingress:
      enabled: false

httpbun:
  enabled: true

initJob:
  enabled: true # requires httpbun.enabled=true (creates /httpbun API)

env: {}
