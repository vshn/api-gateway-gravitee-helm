gravitee:
  mongodb:
    enabled: false
  management:
    type: jdbc
  ratelimit:
    type: jdbc
  jdbc:
    url: jdbc:postgresql://gravitee-test-postgresql:5432/gravitee
    username: gravitee
  elasticsearch:
    enabled: false
  es:
    enabled: false
  api:
    analytics:
      type: none
    # portal URL used in emails (chart template hardcodes https:// otherwise)
    portalURL: http://gravitee.local.test:8080/
    deployment:
      securityContext:
        runAsUser: 1003120000
        runAsGroup: 0
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
    ingress:
      management:
        enabled: true
        ingressClassName: nginx
        scheme: http
        hosts:
          - gravitee.local.test
      portal:
        enabled: true
        ingressClassName: nginx
        scheme: http
        hosts:
          - gravitee.local.test
  installation:
    api:
      url: http://gravitee.local.test:8080
    standalone:
      console:
        urls:
          - http://gravitee.local.test:8080/console
      portal:
        urls:
          - http://gravitee.local.test:8080/
  gateway:
    reporters:
      elasticsearch:
        enabled: false
    deployment:
      securityContext:
        runAsUser: 1003120000
        runAsGroup: 0
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
    ingress:
      enabled: true
      ingressClassName: nginx
      scheme: http
      pathType: Prefix
      path: /httpbun
      hosts:
        - gravitee.local.test
  ui:
    baseURL: http://gravitee.local.test:8080/management
    deployment:
      securityContext:
        runAsUser: 1003120000
        runAsGroup: 0
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
    ingress:
      enabled: true
      ingressClassName: nginx
      scheme: http
      pathType: ImplementationSpecific
      # console app is served at container root; strip the /console prefix
      path: /console(/|$)(.*)
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /$2
      hosts:
        - gravitee.local.test
  portal:
    baseURL: http://gravitee.local.test:8080/portal
    deployment:
      securityContext:
        runAsUser: 1003120000
        runAsGroup: 0
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
    ingress:
      enabled: true
      ingressClassName: nginx
      scheme: http
      pathType: Prefix
      path: /
      hosts:
        - gravitee.local.test

postgresql:
  enabled: true

httpbun:
  enabled: true

initJob:
  enabled: true # requires httpbun.enabled=true (creates /httpbun API)

env: {}
