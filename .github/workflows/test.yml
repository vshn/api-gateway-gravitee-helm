name: test
"on":
  push: {}
  workflow_dispatch: {}

env:
  KUBECONFIG: /tmp/github-ci.kubeconfig

jobs:
  test:
    environment: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_TEST }}

      - env:
          NEWLINE: |2+

          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}


        name: Helm Chart preview
        run: |
          jq -n '.env=(env | with_entries(select(.key | startswith("KUBECONFIG_") | not)))' > ${PWD}/env.yaml
          jq 'select(.!=null)|{vars:.,env:.} | with_entries(select(.key | startswith("KUBECONFIG_") or startswith("github") or startswith("GITHUB") or startswith("ACTIONS") | not))' > "${PWD}/vars.yaml" <<'EOF' ${{ env.NEWLINE }}${{ toJson(vars) }}${{ env.NEWLINE }}EOF
          jq 'select(.!=null)|{secrets:.,env:.}'| with_entries(select(.key | startswith("KUBECONFIG_") or startswith("github") or startswith("GITHUB") or startswith("ACTIONS") | not))' > "${PWD}/secrets.yaml" <<'EOF' ${{ env.NEWLINE }}${{ toJson(secrets) }}${{ env.NEWLINE }}EOF
          jq '.env | keys' ${PWD}/env.yaml
          jq '.env | keys' ${PWD}/vars.yaml
          jq '.env | keys' ${PWD}/secrets.yaml
  
          cp "${KUBECONFIG}" ".github-ci.kubeconfig"
          sudo chmod -R o+w $(printf '%s' "$PWD")
          docker run -v "${PWD}:/data" -w /data ghcr.io/appuio/helm-v4:latest /bin/bash -c "cp .github-ci.kubeconfig /tmp/github-ci.kubeconfig; chmod 400 /tmp/github-ci.kubeconfig; /bin/helm dependency update '/data'; HELM_DIFF_USE_UPGRADE_DRY_RUN=true /bin/helm diff upgrade 'test' '/data' --namespace '${NAMESPACE}' --values '/data/values.yaml' --values '/data/vars.yaml' --values '/data/secrets.yaml' --kubeconfig /tmp/github-ci.kubeconfig --allow-unreleased"

      - env:
          NEWLINE: |2+

          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

        name: Helm Chart deploy
        run: |
          jq -n '.env=(env | with_entries(select(.key | startswith("KUBECONFIG_") | not)))' > ${PWD}/env.yaml
          jq 'select(.!=null)|{vars:.,env:.}' > "${PWD}/vars.yaml" <<'EOF' ${{ env.NEWLINE }}${{ toJson(vars) }}${{ env.NEWLINE }}EOF
          jq 'select(.!=null)|{secrets:.,env:.}' > "${PWD}/secrets.yaml" <<'EOF' ${{ env.NEWLINE }}${{ toJson(secrets) }}${{ env.NEWLINE }}EOF
          cp "${KUBECONFIG}" ".github-ci.kubeconfig"
          sudo chmod -R o+w $(printf '%s' "$PWD")
          docker run -v "${PWD}:/data" -w /data ghcr.io/appuio/helm-v4:latest /bin/bash -c "cp .github-ci.kubeconfig /tmp/github-ci.kubeconfig; chmod 400 /tmp/github-ci.kubeconfig; /bin/helm dependency update /data; /bin/helm upgrade --install 'test' /data --namespace '${NAMESPACE}' --values '/data/values.yaml' --values '/data/vars.yaml' --values '/data/secrets.yaml' --kubeconfig /tmp/github-ci.kubeconfig"
