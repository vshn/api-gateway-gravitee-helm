# Copy to values.secret.yaml (git-ignored) and adjust for your environment.
# deploy.sh falls back to this example when values.secret.yaml is absent.
#
# All secret values come from this single `env` map: the wrapper renders every
# key into a <release>-env Secret, and Gravitee reads the ones it needs via
# kubernetes://<ns>/secrets/<release>-env/<KEY> URIs in gravitee.yml (see the
# upstream helm chart README, "Configuration" section).
#
# - POSTGRES_PASSWORD: bundled postgres user password AND gravitee jdbc password
#   (must be one value). Only applied on first boot (fresh PVC) — to rotate,
#   wipe the PVC or run ALTER USER, then update here.
# - JWT_SECRET: signs management API sessions; must not stay at the chart default.
# - ADMIN_PASSWORD: console login for the single "admin" user (no admin/admin).
# - LITELLM_URL / LITELLM_API_KEY: only used when litellm_api_enabled=true (the
#   render-time guard fires without them). LITELLM_API_KEY is the static Bearer
#   token the gateway sends upstream — replaced on every request, never sent to
#   clients, never logged.
env:
  POSTGRES_PASSWORD: gravitee-kind
  JWT_SECRET: kind-jwt-secret-change-me-9f2c
  ADMIN_PASSWORD: gravitee-admin-pw
  LITELLM_URL: http://litellm.example.internal/4000
  LITELLM_API_KEY: change-me-litellm-static-key
