# Copy to values.secret.yaml (git-ignored) and adjust for your environment.
# deploy.sh falls back to this example when values.secret.yaml is absent.
# Both gravitee.mongo.auth.password and mongodb.env.MONGODB_ROOT_PASSWORD must
# match: the first is what Gravitee logs in with, the second what the mongo
# entrypoint provisions the root user with on first boot (MONGO_INITDB_ROOT_PASSWORD).
gravitee:
  mongo:
    auth:
      password: gravitee-kind-root
mongodb:
  env:
    MONGODB_ROOT_PASSWORD: gravitee-kind-root
    MONGODB_REPLICA_SET_KEY: kindreplkey0123456789abcdef
