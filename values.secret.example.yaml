# Copy to values.secret.yaml (git-ignored) and adjust for your environment.
# deploy.sh falls back to this example when values.secret.yaml is absent.
# Both gravitee.jdbc.password and postgresql.password must match: the first is
# what Gravitee logs in with, the second what the postgres entrypoint provisions
# the user with on first boot (POSTGRES_PASSWORD).
gravitee:
  jdbc:
    password: gravitee-kind
postgresql:
  password: gravitee-kind
