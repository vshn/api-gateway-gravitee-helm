gravitee:
  # -- bundled mongo/es disabled (we bring our own postgres)
  mongodb:
    enabled: false
  elasticsearch:
    enabled: false
  es:
    enabled: false

  # -- core components (all enabled, ingress via openshift-default)
  api:
    enabled: true
    replicaCount: 1
    analytics:
      type: none
    ingress:
      management:
        enabled: true
        ingressClassName: openshift-default
        hosts:
          - vshn-gravitee-wrapper-test.apps.cloudscale-lpg-2.appuio.cloud
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
      portal:
        enabled: true
        ingressClassName: openshift-default
        hosts:
          - vshn-gravitee-wrapper-test.apps.cloudscale-lpg-2.appuio.cloud
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
    deployment:
      securityContext:
        runAsUser: null
        runAsGroup: null
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ "ALL" ]
        seccompProfile:
          type: RuntimeDefault
    # extra env for OIDC (toggle via oidcAuth below or raw env)
    # env: []

  gateway:
    enabled: true
    replicaCount: 1
    reporters:
      elasticsearch:
        enabled: false
    ingress:
      enabled: true
      ingressClassName: openshift-default
      hosts:
        - vshn-gravitee-wrapper-test.apps.cloudscale-lpg-2.appuio.cloud
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        haproxy.router.openshift.io/timeout: 2m
    deployment:
      securityContext:
        runAsUser: null
        runAsGroup: null
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ "ALL" ]
        seccompProfile:
          type: RuntimeDefault

  ui:
    enabled: true
    ingress:
      enabled: true
      ingressClassName: openshift-default
      pathType: Prefix
      path: /console
      hosts:
        - vshn-gravitee-wrapper-test.apps.cloudscale-lpg-2.appuio.cloud
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
    deployment:
      securityContext:
        runAsUser: null
        runAsGroup: null
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ "ALL" ]
        seccompProfile:
          type: RuntimeDefault

  portal:
    enabled: true
    ingress:
      enabled: true
      ingressClassName: openshift-default
      hosts:
        - vshn-gravitee-wrapper-test.apps.cloudscale-lpg-2.appuio.cloud
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
    deployment:
      securityContext:
        runAsUser: null
        runAsGroup: null
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ "ALL" ]
        seccompProfile:
          type: RuntimeDefault

  # -- IdP (configurable, disabled by default — ponytail: wire via env or oidcAuth when needed)
  oidcAuth:
    enabled: false
    # id: mockoidc
    # clientId: gravitee
    # clientSecret: gravitee-secret
    # tokenEndpoint: https://idp.example.com/token
    # authorizeEndpoint: https://idp.example.com/authorize
    # userInfoEndpoint: https://idp.example.com/userinfo
    # userLogoutEndpoint: https://idp.example.com/endsession
    # scopes: [openid, email, profile]
    # userMapping: {id: sub, email: email, firstname: given_name, lastname: family_name}
    # roleMapping:
    #   - condition: "{#jsonPath(#profile, '$.email') == 'dev@example.com'}"
    #     roles: [ORGANIZATION:ADMIN, ENVIRONMENT:ADMIN]

  # -- JDBC repositories (password in values.secret.yaml, see values.secret.example.yaml)
  management:
    type: jdbc
  ratelimit:
    type: jdbc
  jdbc:
    url: jdbc:postgresql://gravitee-test-postgresql:5432/gravitee
    username: gravitee
    # PostgreSQL driver is bundled in the APIM images (jdbc.driverSource=auto)

# -- wrapper-only
# -- bundled single-replica postgres (password in values.secret.yaml, see values.secret.example.yaml)
#    external DB later: postgresql.enabled=false + point gravitee.jdbc.url/username/password at it
postgresql:
  enabled: true
  user: gravitee
  database: gravitee
  storage: 5Gi
  image:
    repository: dockerhub.vshn.net/library/postgres
    tag: "16"
httpbun:
  enabled: true
  replicaCount: 1
  image:
    repository: docker.io/sharat87/httpbun
    tag: latest@sha256:538a126de2cd4235a8f1f87deb0d002791fd2d4f274033c4050961b6153a0a9a
    pullPolicy: IfNotPresent
  service:
    port: 80

initJob:
  enabled: true # requires httpbun.enabled=true (creates /httpbun API -> httpbun svc)
  image:
    repository: ghcr.io/digitalocean-packages/doks-debug
    tag: latest@sha256:55d72c171c3549aec74fc41088f4162e8b48d4da6bcbd98dcaf2c1cbc85c2a99
    pullPolicy: IfNotPresent
  # 3 API keys covering all upstreams; unauthorized never hits upstream (API_KEY plan)
  apiKeys: 3

# -- generic env -> Secret bridge (like litellm env: {})
env: {}
